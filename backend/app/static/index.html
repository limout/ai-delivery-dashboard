<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Delivery Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .controls input {
            padding: 10px;
            font-size: 16px;
            width: 120px;
        }

        .controls button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .category {
            margin-bottom: 35px;
        }

        .category-title {
            font-size: 22px;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 16px;
            margin-top: 0;
            color: #666;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0 5px;
        }

        .unit {
            color: #777;
        }

        .sample {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .description {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
            line-height: 1.4;
        }

        .error {
            margin-top: 20px;
            color: #b00020;
        }

        @media (max-width: 800px) {
            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Delivery Dashboard</h1>

    <div class="controls">
        <label for="project">Project:</label>
        <input id="project" type="text" value="KAN">
        <button onclick="loadMetrics()">Load Metrics</button>
    </div>

    <div id="metrics">
        Loading...
    </div>

    <div id="error" class="error"></div>

</div>

<script>
    async function loadMetrics() {
        try {
            const project = document.getElementById("project").value.trim();

            if (!project) {
                throw new Error("Project is required");
            }

            const response = await fetch(
                `/projects/${encodeURIComponent(project)}/metrics`
            );

            if (!response.ok) {
                throw new Error("Failed to load metrics");
            }

            const data = await response.json();

            const container = document.getElementById("metrics");
            const errorContainer = document.getElementById("error");

            container.innerHTML = "";
            errorContainer.textContent = "";

            // Group metrics by category
            const categories = {};

            for (const [name, metric] of Object.entries(data)) {
                const category = metric.category || "other";

                if (!categories[category]) {
                    categories[category] = [];
                }

                categories[category].push({
                    name,
                    ...metric
                });
            }

            // Preferred category order
            const categoryOrder = [
                "snapshot",
                "flow",
                "planning",
                "business",
                "team",
                "other"
            ];

            const sortedCategories = Object.keys(categories).sort((a, b) => {
                const indexA = categoryOrder.indexOf(a);
                const indexB = categoryOrder.indexOf(b);

                return (
                    (indexA === -1 ? 999 : indexA) -
                    (indexB === -1 ? 999 : indexB)
                );
            });

            // Render categories
            for (const category of sortedCategories) {

                const categorySection = document.createElement("div");
                categorySection.className = "category";

                const categoryTitle = document.createElement("h2");
                categoryTitle.className = "category-title";
                categoryTitle.textContent = category;

                const metricsGrid = document.createElement("div");
                metricsGrid.className = "metrics";

                for (const metric of categories[category]) {

                    const card = document.createElement("div");
                    card.className = "card";

                    const title = metric.name
                        .replaceAll("_", " ")
                        .toUpperCase();

                    const value = metric.value === null
                        ? "N/A"
                        : metric.value;

                    const sampleText = metric.sample_size
                        ? `Sample: ${metric.sample_size} items`
                        : "No completed items";

                    const unitText = metric.value === null
                        ? "No completed cycles"
                        : metric.unit;

                    card.innerHTML = `
                        <h2>${title}</h2>
                        <div class="value">${value}</div>
                        <div class="unit">${unitText}</div>
                        <div class="sample">${sampleText}</div>
                        <div class="description">${metric.description}</div>
                    `;

                    metricsGrid.appendChild(card);
                }

                categorySection.appendChild(categoryTitle);
                categorySection.appendChild(metricsGrid);

                container.appendChild(categorySection);
            }

        } catch (error) {
            document.getElementById("error").textContent =
                "Error loading metrics: " + error.message;
        }
    }

    loadMetrics();
</script>

</body>
</html>
