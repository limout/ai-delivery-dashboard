<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Delivery Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .controls input {
            padding: 10px;
            font-size: 16px;
            width: 120px;
        }

        .controls button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .metric-selector {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .metric-selector h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .category-selector {
            margin-bottom: 20px;
        }

        .category-selector:last-child {
            margin-bottom: 0;
        }

        .category-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: capitalize;
            margin-bottom: 10px;
        }

        .metric-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .category {
            margin-bottom: 35px;
        }

        .category > .category-title {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 16px;
            margin-top: 0;
            color: #666;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0 5px;
        }

        .unit {
            color: #777;
        }

        .sample {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .description {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
            line-height: 1.4;
        }

        .history-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 35px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-header h2 {
            margin: 0;
        }

        .history-controls {
            display: flex;
            gap: 8px;
        }

        .history-controls button {
            padding: 7px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
        }

        .history-controls button.active {
            font-weight: bold;
            background: #eee;
        }

        .chart-wrapper {
            width: 100%;
        }

        .chart {
            width: 100%;
            height: 350px;
            display: block;
        }

        .chart-empty {
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .history-status {
            margin-top: 15px;
            color: #777;
            font-size: 13px;
        }

        .error {
            margin-top: 20px;
            color: #b00020;
        }

        @media (max-width: 800px) {
            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }

            .history-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }
        }

        @media (max-width: 550px) {
            .metrics {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Delivery Dashboard</h1>

    <div class="controls">
        <label for="project">Project:</label>
        <input id="project" type="text" value="KAN">
        <button id="load-button" onclick="loadMetrics()">Load Metrics</button>
    </div>

    <div id="metric-selector" class="metric-selector">
        <h2>Metrics</h2>
        Loading available metrics...
    </div>

    <div id="metrics"></div>

    <div id="history-section" class="history-section">

        <div class="history-header">
            <h2>Historical Metrics</h2>

            <div class="history-controls">
                <button
                    id="days-7"
                    onclick="loadHistoricalMetrics(7)"
                >
                    7 days
                </button>

                <button
                    id="days-14"
                    class="active"
                    onclick="loadHistoricalMetrics(14)"
                >
                    14 days
                </button>

                <button
                    id="days-30"
                    onclick="loadHistoricalMetrics(30)"
                >
                    30 days
                </button>
            </div>
        </div>

        <div class="chart-wrapper">
            <svg
                id="wip-chart"
                class="chart"
                viewBox="0 0 1000 350"
                preserveAspectRatio="none"
            ></svg>
        </div>

        <div id="history-status" class="history-status">
            Loading historical WIP...
        </div>

    </div>

    <div id="error" class="error"></div>

</div>

<script>

    let availableMetrics = [];


    async function loadAvailableMetrics() {

        const response = await fetch("/metrics");

        if (!response.ok) {
            throw new Error("Failed to load available metrics");
        }

        const data = await response.json();

        availableMetrics = data.available_metrics;

        renderMetricSelector();
    }


    function renderMetricSelector() {

        const selector =
            document.getElementById("metric-selector");

        selector.innerHTML = "<h2>Metrics</h2>";

        const categories = {};

        for (const metric of availableMetrics) {

            const category =
                metric.category || "other";

            if (!categories[category]) {
                categories[category] = [];
            }

            categories[category].push(metric);
        }

        const categoryOrder = [
            "snapshot",
            "flow",
            "planning",
            "business",
            "team",
            "other"
        ];

        const sortedCategories =
            Object.keys(categories).sort((a, b) => {

                const indexA =
                    categoryOrder.indexOf(a);

                const indexB =
                    categoryOrder.indexOf(b);

                return (
                    (indexA === -1 ? 999 : indexA) -
                    (indexB === -1 ? 999 : indexB)
                );
            });


        for (const category of sortedCategories) {

            const categoryContainer =
                document.createElement("div");

            categoryContainer.className =
                "category-selector";

            const categoryTitle =
                document.createElement("div");

            categoryTitle.className =
                "category-title";

            categoryTitle.textContent =
                category;

            categoryContainer.appendChild(
                categoryTitle
            );


            for (const metric of categories[category]) {

                const label =
                    document.createElement("label");

                label.className =
                    "metric-option";

                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.value = metric.name;
                checkbox.checked = true;

                label.appendChild(checkbox);

                const text =
                    document.createTextNode(
                        metric.name
                            .replaceAll("_", " ")
                            .replace(
                                /\b\w/g,
                                letter =>
                                    letter.toUpperCase()
                            )
                    );

                label.appendChild(text);

                categoryContainer.appendChild(label);
            }

            selector.appendChild(categoryContainer);
        }
    }


    function getSelectedMetrics() {

        const checkboxes =
            document.querySelectorAll(
                '#metric-selector input[type="checkbox"]:checked'
            );

        return Array.from(checkboxes).map(
            checkbox => checkbox.value
        );
    }


    async function loadMetrics() {

        const container =
            document.getElementById("metrics");

        const errorContainer =
            document.getElementById("error");

        const button =
            document.getElementById("load-button");

        try {

            const project =
                document.getElementById("project")
                    .value
                    .trim();

            if (!project) {
                throw new Error("Project is required");
            }

            const selectedMetrics =
                getSelectedMetrics();

            if (selectedMetrics.length === 0) {
                throw new Error(
                    "Select at least one metric"
                );
            }

            button.disabled = true;
            button.textContent = "Loading...";

            container.innerHTML = "Loading...";
            errorContainer.textContent = "";

            const query =
                selectedMetrics
                    .map(
                        metric =>
                            `metric_names=${encodeURIComponent(metric)}`
                    )
                    .join("&");

            const response =
                await fetch(
                    `/projects/${encodeURIComponent(project)}/metrics?${query}`
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to load metrics"
                );
            }

            const data =
                await response.json();

            container.innerHTML = "";

            const categories = {};

            for (
                const [name, metric]
                of Object.entries(data)
            ) {

                if (!selectedMetrics.includes(name)) {
                    continue;
                }

                const category =
                    metric.category || "other";

                if (!categories[category]) {
                    categories[category] = [];
                }

                categories[category].push({
                    name,
                    ...metric
                });
            }

            const categoryOrder = [
                "snapshot",
                "flow",
                "planning",
                "business",
                "team",
                "other"
            ];

            const sortedCategories =
                Object.keys(categories).sort(
                    (a, b) => {

                        const indexA =
                            categoryOrder.indexOf(a);

                        const indexB =
                            categoryOrder.indexOf(b);

                        return (
                            (indexA === -1 ? 999 : indexA) -
                            (indexB === -1 ? 999 : indexB)
                        );
                    }
                );


            for (const category of sortedCategories) {

                const categorySection =
                    document.createElement("div");

                categorySection.className =
                    "category";

                const categoryTitle =
                    document.createElement("h2");

                categoryTitle.className =
                    "category-title";

                categoryTitle.textContent =
                    category;

                const metricsGrid =
                    document.createElement("div");

                metricsGrid.className =
                    "metrics";


                for (const metric of categories[category]) {

                    const card =
                        document.createElement("div");

                    card.className = "card";

                    const title =
                        metric.name
                            .replaceAll("_", " ")
                            .toUpperCase();

                    const value =
                        metric.value === null
                            ? "N/A"
                            : metric.value;

                    const sampleText =
                        metric.sample_size
                            ? `Sample: ${metric.sample_size} items`
                            : "No completed items";

                    const unitText =
                        metric.value === null
                            ? "No completed cycles"
                            : metric.unit;

                    let qualityText = "";

                    if (metric.data_quality) {

                        qualityText =
                            `${metric.data_quality.status}: ` +
                            `${metric.data_quality.message}`;
                    }

                    card.innerHTML = `
                        <h2>${title}</h2>
                        <div class="value">${value}</div>
                        <div class="unit">${unitText}</div>
                        <div class="sample">${sampleText}</div>
                        <div class="description">${metric.description}</div>
                        ${
                            qualityText
                                ? `<div class="description">${qualityText}</div>`
                                : ""
                        }
                    `;

                    metricsGrid.appendChild(card);
                }

                categorySection.appendChild(
                    categoryTitle
                );

                categorySection.appendChild(
                    metricsGrid
                );

                container.appendChild(
                    categorySection
                );
            }

        } catch (error) {

            container.innerHTML = "";

            errorContainer.textContent =
                "Error loading metrics: " +
                error.message;

        } finally {

            button.disabled = false;
            button.textContent = "Load Metrics";
        }
    }


    async function loadHistoricalMetrics(days = 14) {

        const project =
            document.getElementById("project")
                .value
                .trim();

        const chart =
            document.getElementById("wip-chart");

        const status =
            document.getElementById("history-status");

        const errorContainer =
            document.getElementById("error");

        if (!project) {

            errorContainer.textContent =
                "Project is required";

            return;
        }

        chart.innerHTML = "";

        status.textContent =
            "Loading historical WIP...";

        document
            .querySelectorAll(
                ".history-controls button"
            )
            .forEach(
                button =>
                    button.classList.remove("active")
            );

        document
            .getElementById(`days-${days}`)
            .classList.add("active");

        try {

            const response =
                await fetch(
                    `/projects/${encodeURIComponent(project)}/metrics/history?metric=wip&days=${days}`
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to load historical metrics"
                );
            }

            const data =
                await response.json();

            renderWipChart(data);

        } catch (error) {

            chart.innerHTML = "";

            status.textContent = "";

            errorContainer.textContent =
                "Error loading historical metrics: " +
                error.message;
        }
    }


    function renderWipChart(data) {

        const chart =
            document.getElementById("wip-chart");

        const status =
            document.getElementById("history-status");

        chart.innerHTML = "";

        if (
            !data.points ||
            data.points.length === 0
        ) {

            status.textContent =
                "No historical data available.";

            return;
        }

        const points = data.points;

        const width = 1000;
        const height = 350;

        const paddingLeft = 55;
        const paddingRight = 25;
        const paddingTop = 20;
        const paddingBottom = 50;

        const chartWidth =
            width -
            paddingLeft -
            paddingRight;

        const chartHeight =
            height -
            paddingTop -
            paddingBottom;

        const values =
            points.map(point => point.value);

        const maxValue =
            Math.max(...values, 1);

        const svgNS =
            "http://www.w3.org/2000/svg";


        function createElement(
            name,
            attributes = {}
        ) {

            const element =
                document.createElementNS(
                    svgNS,
                    name
                );

            for (
                const [key, value]
                of Object.entries(attributes)
            ) {
                element.setAttribute(
                    key,
                    value
                );
            }

            return element;
        }


        // Horizontal grid + Y labels

        const gridSteps =
            Math.min(5, maxValue);

        for (
            let i = 0;
            i <= gridSteps;
            i++
        ) {

            const value =
                (maxValue / gridSteps) * i;

            const y =
                paddingTop +
                chartHeight -
                (value / maxValue) *
                    chartHeight;

            const line =
                createElement(
                    "line",
                    {
                        x1: paddingLeft,
                        y1: y,
                        x2: width - paddingRight,
                        y2: y,
                        stroke: "#e5e5e5"
                    }
                );

            chart.appendChild(line);

            const label =
                createElement(
                    "text",
                    {
                        x: paddingLeft - 10,
                        y: y + 4,
                        "text-anchor": "end",
                        "font-size": "12",
                        fill: "#777"
                    }
                );

            label.textContent =
                Math.round(value);

            chart.appendChild(label);
        }


        // Calculate points

        const svgPoints =
            points.map((point, index) => {

                const x =
                    points.length === 1
                        ? paddingLeft +
                          chartWidth / 2
                        : paddingLeft +
                          (index /
                              (points.length - 1)) *
                              chartWidth;

                const y =
                    paddingTop +
                    chartHeight -
                    (point.value / maxValue) *
                        chartHeight;

                return {
                    x,
                    y,
                    date: point.date,
                    value: point.value
                };
            });


        // Line

        const polyline =
            createElement(
                "polyline",
                {
                    points: svgPoints
                        .map(
                            point =>
                                `${point.x},${point.y}`
                        )
                        .join(" "),
                    fill: "none",
                    stroke: "#222",
                    "stroke-width": "3",
                    "stroke-linejoin": "round",
                    "stroke-linecap": "round"
                }
            );

        chart.appendChild(polyline);


        // Points + tooltips

        svgPoints.forEach(point => {

            const circle =
                createElement(
                    "circle",
                    {
                        cx: point.x,
                        cy: point.y,
                        r: 5,
                        fill: "#222"
                    }
                );

            const tooltip =
                createElement("title");

            tooltip.textContent =
                `${point.date}: ${point.value} items`;

            circle.appendChild(tooltip);

            chart.appendChild(circle);
        });


        // X labels

        const labelStep =
            Math.max(
                1,
                Math.ceil(points.length / 7)
            );

        svgPoints.forEach(
            (point, index) => {

                if (
                    index % labelStep !== 0 &&
                    index !== points.length - 1
                ) {
                    return;
                }

                const label =
                    createElement(
                        "text",
                        {
                            x: point.x,
                            y: height - 15,
                            "text-anchor": "middle",
                            "font-size": "12",
                            fill: "#777"
                        }
                    );

                label.textContent =
                    formatChartDate(point.date);

                chart.appendChild(label);
            }
        );


        status.textContent =
            `WIP history · ${points.length} days`;
    }


    function formatChartDate(dateString) {

        const date =
            new Date(
                `${dateString}T00:00:00`
            );

        return date.toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric"
            }
        );
    }


    async function initializeDashboard() {

        try {

            await loadAvailableMetrics();

            await loadMetrics();

            await loadHistoricalMetrics(14);

        } catch (error) {

            document.getElementById("error")
                .textContent =
                    "Error initializing dashboard: " +
                    error.message;
        }
    }


    initializeDashboard();

</script>

</body>
</html>
