<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Delivery Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 240px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .controls input {
            padding: 10px;
            font-size: 16px;
            width: 120px;
        }

        .controls button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .dashboard-controls {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .selection-row {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
        }

        .control-group select {
            min-width: 280px;
            padding: 11px 12px;
            font-size: 16px;
            line-height: 1.3;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            color: #222;
        }

        .selection-row button {
            padding: 11px 18px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
        }

        .selection-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .dashboard-controls > .metric-selector {
            margin: 22px 0 0;
            padding: 0;
            box-shadow: none;
        }

        .dashboard-controls > .metric-selector h2 {
            margin-bottom: 16px;
        }



        .source-overview {
            margin: 28px 0 34px;
        }

        .source-header, .work-items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .source-cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .source-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            background: #fff;
        }

        .source-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-name {
            font-size: 18px;
            font-weight: 700;
        }

        .source-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eee;
        }

        .source-status.connected { background: #e8f5e9; color: #2e7d32; }
        .source-status.error { background: #ffebee; color: #c62828; }

        .source-count {
            font-size: 30px;
            font-weight: 700;
            margin-top: 12px;
        }

        .overview-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .overview-controls select {
            min-width: 150px;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }

        .work-items-section {
            margin: 34px 0;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
        }

        .work-items-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .work-items-table th, .work-items-table td {
            padding: 11px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        .work-items-table th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
            background: #f7f7f7;
        }

        .work-items-table tr:last-child td { border-bottom: 0; }

        .badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 5px;
            background: #f0f0f0;
            font-size: 12px;
        }

        .work-item-title {
            font-weight: 600;
        }

        .work-item-id {
            font-size: 11px;
            color: #777;
            margin-top: 3px;
        }

        .table-status {
            padding: 4px 7px;
            border-radius: 5px;
            font-size: 12px;
            background: #f0f0f0;
        }

        .overview-status {
            min-height: 20px;
            color: #666;
            margin: 8px 0 12px;
        }

        @media (max-width: 700px) {
            .source-cards { grid-template-columns: 1fr; }
            .source-header, .work-items-header { align-items: flex-start; flex-direction: column; }
        }

        .metric-selector {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .metric-selector h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .category-selector {
            margin-bottom: 16px;
        }

        .category-selector:last-child {
            margin-bottom: 0;
        }

        .category-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: capitalize;
            margin-bottom: 10px;
        }

        .metric-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .category {
            margin-bottom: 35px;
        }

        .category > .category-title {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 16px;
            margin-top: 0;
            color: #666;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0 5px;
        }

        .unit {
            color: #777;
        }

        .sample {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .description {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
            line-height: 1.4;
        }

        .history-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 35px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-header h2 {
            margin: 0;
        }

        .history-controls {
            display: flex;
            gap: 8px;
        }

        .history-controls button {
            padding: 7px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
        }

        .history-controls {
            flex-wrap: wrap;
        }

        .history-controls button.active {
            font-weight: bold;
            background: #eee;
        }

        .history-metric-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .history-metric-selector button {
            padding: 8px 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .history-metric-selector button.active {
            font-weight: bold;
            background: #eee;
        }

        .history-chart-title {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .chart-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .chart {
            width: 100%;
            height: 350px;
            display: block;
        }

        .chart-empty {
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .history-status {
            margin-top: 15px;
            color: #777;
            font-size: 13px;
        }

        .error {
            margin-top: 20px;
            color: #b00020;
        }

        @media (max-width: 800px) {
            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }

            .history-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }
        }

        @media (max-width: 550px) {
            .metrics {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Delivery Dashboard</h1>

    <section class="dashboard-controls">
        <div class="selection-row">
            <div class="control-group">
                <label for="source-select">Source</label>
                <select id="source-select" onchange="loadProjects()">
                    <option value="">Loading sources...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="project-select">Project</label>
                <select id="project-select" disabled onchange="handleProjectChange()">
                    <option value="">Select a project...</option>
                </select>
            </div>

            <button id="load-button" onclick="loadMetrics()" disabled>Load Dashboard</button>
        </div>

        <div id="selection-status" class="overview-status">Select a source and project to begin.</div>

        <div id="metric-selector" class="metric-selector">
            <h2>Metrics</h2>
            Loading available metrics...
        </div>
    </section>

    <section id="source-overview" class="source-overview" style="display:none;">
        <div class="source-header">
            <div>
                <h2 id="dashboard-context">Delivery Overview</h2>
                <div id="source-status" class="overview-status"></div>
            </div>
            <button id="work-items-toggle" onclick="toggleWorkItems()" style="display:none;">
                View Work Items
            </button>
        </div>
    </section>

    <section id="work-items-section" class="work-items-section" style="display:none;">
        <div class="work-items-header">
            <div>
                <h2>Work Items</h2>
                <div id="work-items-status" class="overview-status"></div>
            </div>
            <div class="overview-controls">
                <select id="work-role-filter" onchange="renderWorkItems()">
                    <option value="all">All Roles</option>
                    <option value="container">Container</option>
                    <option value="planning_item">Planning Item</option>
                    <option value="execution_item">Execution Item</option>
                    <option value="defect">Defect</option>
                    <option value="unknown">Unknown</option>
                </select>
                <select id="work-status-filter" onchange="renderWorkItems()">
                    <option value="all">All Statuses</option>
                </select>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="work-items-table">
                <thead>
                    <tr>
                        <th>Work Item</th>
                        <th>Type / Role</th>
                        <th>Status</th>
                        <th>Parent</th>
                        <th>Story Points</th>
                    </tr>
                </thead>
                <tbody id="work-items-body"></tbody>
            </table>
        </div>
    </section>

    <div id="metrics"></div>

    <div id="history-section" class="history-section" data-project-loaded="false" style="display: none;">

        <div class="history-header">
            <h2>Historical Metrics</h2>

            <div class="history-controls">
                <button
                    id="days-7"
                    onclick="loadHistoricalMetrics(7)"
                >
                    7 days
                </button>

                <button
                    id="days-14"
                    class="active"
                    onclick="loadHistoricalMetrics(14)"
                >
                    14 days
                </button>

                <button
                    id="days-30"
                    onclick="loadHistoricalMetrics(30)"
                >
                    30 days
                </button>
            </div>
        </div>

        <div class="history-metric-selector">
            <button
                id="history-metric-wip"
                class="active"
                onclick="selectHistoricalMetric('wip')"
            >
                WIP
            </button>

            <button
                id="history-metric-throughput"
                onclick="selectHistoricalMetric('throughput')"
            >
                Throughput
            </button>

            <button
                id="history-metric-cycle_time"
                onclick="selectHistoricalMetric('cycle_time')"
            >
                Cycle Time
            </button>

            <button
                id="history-metric-lead_time"
                onclick="selectHistoricalMetric('lead_time')"
            >
                Lead Time
            </button>

            <button
                id="history-metric-velocity"
                onclick="selectHistoricalMetric('velocity')"
            >
                Velocity
            </button>

            <button
                id="history-metric-commitment_vs_completed"
                onclick="selectHistoricalMetric('commitment_vs_completed')"
            >
                Commitment vs Completed
            </button>
        </div>

        <div id="history-chart-title" class="history-chart-title">
            WIP · items
        </div>

        <div class="chart-wrapper">
            <svg
                id="history-chart"
                class="chart"
                viewBox="0 0 1000 350"
                preserveAspectRatio="none"
            ></svg>
        </div>

        <div id="history-status" class="history-status">
            Loading historical WIP...
        </div>

    </div>

    <div id="error" class="error"></div>

</div>

<script>

    let availableMetrics = [];



    let allWorkItems = [];

    async function loadSources() {
        const select = document.getElementById("source-select");
        try {
            const response = await fetch("/sources");
            if (!response.ok) throw new Error("Failed to load sources");
            const data = await response.json();
            select.innerHTML = '<option value="">Select a source...</option>' +
                data.sources.map(source =>
                    `<option value="${escapeHtml(source.source)}" ${source.status !== "connected" ? "disabled" : ""}>${escapeHtml(source.label)}${source.status !== "connected" ? " (unavailable)" : ""}</option>`
                ).join("");
        } catch (error) {
            select.innerHTML = '<option value="">Unable to load sources</option>';
            document.getElementById("error").textContent = error.message;
        }
    }

    async function loadProjects() {
        const source = document.getElementById("source-select").value;
        const projectSelect = document.getElementById("project-select");
        const button = document.getElementById("load-button");
        projectSelect.disabled = true;
        button.disabled = true;
        projectSelect.innerHTML = '<option value="">Loading projects...</option>';
        clearDashboard();

        if (!source) {
            projectSelect.innerHTML = '<option value="">Select a project...</option>';
            document.getElementById("selection-status").textContent = "Select a source and project to begin.";
            return;
        }

        try {
            const response = await fetch(`/sources/${encodeURIComponent(source)}/projects`);
            if (!response.ok) throw new Error("Failed to load projects");
            const data = await response.json();
            projectSelect.innerHTML = '<option value="">Select a project...</option>' +
                data.projects.map(project =>
                    `<option value="${escapeHtml(project.key)}">${escapeHtml(project.name)} (${escapeHtml(project.key)})</option>`
                ).join("");
            projectSelect.disabled = false;
            document.getElementById("selection-status").textContent =
                `${data.projects.length} project${data.projects.length === 1 ? "" : "s"} available in ${formatSource(source)}.`;
        } catch (error) {
            projectSelect.innerHTML = '<option value="">Unable to load projects</option>';
            document.getElementById("error").textContent = error.message;
        }
    }

    function handleProjectChange() {
        const project = document.getElementById("project-select").value;
        document.getElementById("load-button").disabled = !project;
        clearDashboard();
        document.getElementById("selection-status").textContent = project
            ? `Ready to load ${formatSource(document.getElementById("source-select").value)} · ${project}.`
            : "Select a project to begin.";
    }

    function clearDashboard() {
        document.getElementById("source-overview").style.display = "none";
        document.getElementById("work-items-section").style.display = "none";
        document.getElementById("work-items-toggle").style.display = "none";
        document.getElementById("metrics").innerHTML = "";
        document.getElementById("history-section").style.display = "none";
        document.getElementById("error").textContent = "";
    }

    async function loadOverview() {
        const project = document.getElementById("project-select").value;
        const source = document.getElementById("source-select").value;
        const status = document.getElementById("source-status");
        if (!project || !source) return;

        const workResponse = await fetch(
            `/projects/${encodeURIComponent(project)}/work-items?source=${encodeURIComponent(source)}`
        );
        if (!workResponse.ok) throw new Error("Failed to load work items");
        const workData = await workResponse.json();
        allWorkItems = workData.work_items || [];
        document.getElementById("source-overview").style.display = "block";
        document.getElementById("work-items-section").style.display = "none";

        const workItemsToggle = document.getElementById("work-items-toggle");
        workItemsToggle.style.display = "inline-block";
        workItemsToggle.textContent = "View Work Items";

        document.getElementById("dashboard-context").textContent = `${formatSource(source)} · ${project}`;
        status.textContent = `${allWorkItems.length} normalized work items available`;
        updateStatusFilter();
        renderWorkItems();
    }

    function updateStatusFilter() {
        const select = document.getElementById("work-status-filter");
        const current = select.value;
        const statuses = [...new Set(allWorkItems.map(item => item.status).filter(Boolean))].sort();
        select.innerHTML = '<option value="all">All Statuses</option>' +
            statuses.map(status => `<option value="${escapeHtml(status)}">${escapeHtml(status)}</option>`).join("");
        if (statuses.includes(current)) select.value = current;
    }

    function toggleWorkItems() {
        const section = document.getElementById("work-items-section");
        const button = document.getElementById("work-items-toggle");

        if (section.style.display === "none") {
            section.style.display = "block";
            button.textContent = "Hide Work Items";
        } else {
            section.style.display = "none";
            button.textContent = "View Work Items";
        }
    }


    function renderWorkItems() {
        const role = document.getElementById("work-role-filter").value;
        const status = document.getElementById("work-status-filter").value;
        const filtered = allWorkItems.filter(item =>
            (role === "all" || item.delivery_role === role) &&
            (status === "all" || item.status === status)
        );
        const body = document.getElementById("work-items-body");
        document.getElementById("work-items-status").textContent = `${filtered.length} of ${allWorkItems.length} work items`;
        if (!filtered.length) {
            body.innerHTML = '<tr><td colspan="5">No work items match the selected filters.</td></tr>';
            return;
        }
        body.innerHTML = filtered.map(item => `
            <tr>
                <td><div class="work-item-title">${escapeHtml(item.title || "Untitled")}</div><div class="work-item-id">${escapeHtml(item.id)}</div></td>
                <td><div>${escapeHtml(item.type || "Unknown")}</div><div class="work-item-id">${formatRole(item.delivery_role)}</div></td>
                <td><span class="table-status">${escapeHtml(item.status || "—")}</span></td>
                <td>${escapeHtml(item.parent_id || "—")}</td>
                <td>${item.story_points == null ? "—" : item.story_points}</td>
            </tr>`).join("");
    }

    function formatSource(source) {
        return source === "azure_devops" ? "Azure DevOps" : "Jira";
    }

    function formatRole(role) {
        if (!role) return "Unknown";
        return role.replaceAll("_", " ").replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    async function loadAvailableMetrics() {

        const response = await fetch("/metrics");

        if (!response.ok) {
            throw new Error("Failed to load available metrics");
        }

        const data = await response.json();

        availableMetrics = data.available_metrics;

        renderMetricSelector();
    }


    function renderMetricSelector() {

        const selector =
            document.getElementById("metric-selector");

        selector.innerHTML = "<h2>Metrics</h2>";

        const categories = {};

        for (const metric of availableMetrics) {

            const category =
                metric.category || "other";

            if (!categories[category]) {
                categories[category] = [];
            }

            categories[category].push(metric);
        }

        const categoryOrder = [
            "snapshot",
            "flow",
            "planning",
            "business",
            "team",
            "other"
        ];

        const sortedCategories =
            Object.keys(categories).sort((a, b) => {

                const indexA =
                    categoryOrder.indexOf(a);

                const indexB =
                    categoryOrder.indexOf(b);

                return (
                    (indexA === -1 ? 999 : indexA) -
                    (indexB === -1 ? 999 : indexB)
                );
            });


        for (const category of sortedCategories) {

            const categoryContainer =
                document.createElement("div");

            categoryContainer.className =
                "category-selector";

            const categoryTitle =
                document.createElement("div");

            categoryTitle.className =
                "category-title";

            categoryTitle.textContent =
                category;

            categoryContainer.appendChild(
                categoryTitle
            );


            for (const metric of categories[category]) {

                const label =
                    document.createElement("label");

                label.className =
                    "metric-option";

                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.value = metric.name;
                checkbox.checked = true;
                checkbox.addEventListener(
                    "change",
                    async () => {
                        const historySection =
                            document.getElementById("history-section");

                        // Before a project is loaded, changing the selection
                        // only changes the selection itself.
                        if (
                            historySection.dataset.projectLoaded !== "true"
                        ) {
                            return;
                        }

                        const selectedMetrics = getSelectedMetrics();

                        // No selected metrics: clear the metric cards and history.
                        if (selectedMetrics.length === 0) {
                            document.getElementById("metrics").innerHTML = "";
                            historySection.style.display = "none";
                            return;
                        }

                        // Recalculate and redraw the cards for the current
                        // source/project using the new metric selection.
                        await loadMetrics();
                    }
                );

                label.appendChild(checkbox);

                const text =
                    document.createTextNode(
                        metric.name
                            .replaceAll("_", " ")
                            .replace(
                                /\b\w/g,
                                letter =>
                                    letter.toUpperCase()
                            )
                    );

                label.appendChild(text);

                categoryContainer.appendChild(label);
            }

            selector.appendChild(categoryContainer);
        }
    }


    function getSelectedMetrics() {

        const checkboxes =
            document.querySelectorAll(
                '#metric-selector input[type="checkbox"]:checked'
            );

        return Array.from(checkboxes).map(
            checkbox => checkbox.value
        );
    }


    async function loadMetrics() {

        const container =
            document.getElementById("metrics");

        const errorContainer =
            document.getElementById("error");

        const button =
            document.getElementById("load-button");

        try {

            const project =
                document.getElementById("project-select").value.trim();

            if (!project) {
                throw new Error("Project is required");
            }

            const selectedMetrics =
                getSelectedMetrics();

            if (selectedMetrics.length === 0) {
                throw new Error(
                    "Select at least one metric"
                );
            }

            button.disabled = true;
            button.textContent = "Loading...";

            await loadOverview();

            container.innerHTML = "Loading...";
            errorContainer.textContent = "";

            const source = document.getElementById("source-select").value;

            const query =
                selectedMetrics
                    .map(
                        metric =>
                            `metric_names=${encodeURIComponent(metric)}`
                    )
                    .join("&");

            const response =
                await fetch(
                    `/projects/${encodeURIComponent(project)}/metrics?${query}&source=${encodeURIComponent(source)}`
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to load metrics"
                );
            }

            const data =
                await response.json();

            container.innerHTML = "";

            const historySection =
                document.getElementById("history-section");

            historySection.dataset.projectLoaded = "true";

            const categories = {};

            for (
                const [name, metric]
                of Object.entries(data)
            ) {

                if (!selectedMetrics.includes(name)) {
                    continue;
                }

                const category =
                    metric.category || "other";

                if (!categories[category]) {
                    categories[category] = [];
                }

                categories[category].push({
                    name,
                    ...metric
                });
            }

            const categoryOrder = [
                "snapshot",
                "flow",
                "planning",
                "business",
                "team",
                "other"
            ];

            const sortedCategories =
                Object.keys(categories).sort(
                    (a, b) => {

                        const indexA =
                            categoryOrder.indexOf(a);

                        const indexB =
                            categoryOrder.indexOf(b);

                        return (
                            (indexA === -1 ? 999 : indexA) -
                            (indexB === -1 ? 999 : indexB)
                        );
                    }
                );


            for (const category of sortedCategories) {

                const categorySection =
                    document.createElement("div");

                categorySection.className =
                    "category";

                const categoryTitle =
                    document.createElement("h2");

                categoryTitle.className =
                    "category-title";

                categoryTitle.textContent =
                    category;

                const metricsGrid =
                    document.createElement("div");

                metricsGrid.className =
                    "metrics";


                for (const metric of categories[category]) {

                    const card =
                        document.createElement("div");

                    card.className = "card";

                    const title =
                        metric.name
                            .replaceAll("_", " ")
                            .toUpperCase();

                    const value =
                        metric.value === null
                            ? "N/A"
                            : metric.value;

                    const sampleText =
                        metric.sample_size
                            ? `Sample: ${metric.sample_size} items`
                            : "No completed items";

                    const unitText =
                        metric.value === null
                            ? "No completed cycles"
                            : metric.unit;

                    let qualityText = "";

                    if (metric.data_quality) {

                        qualityText =
                            `${metric.data_quality.status}: ` +
                            `${metric.data_quality.message}`;
                    }

                    card.innerHTML = `
                        <h2>${title}</h2>
                        <div class="value">${value}</div>
                        <div class="unit">${unitText}</div>
                        <div class="sample">${sampleText}</div>
                        <div class="description">${metric.description}</div>
                        ${
                            qualityText
                                ? `<div class="description">${qualityText}</div>`
                                : ""
                        }
                    `;

                    metricsGrid.appendChild(card);
                }

                categorySection.appendChild(
                    categoryTitle
                );

                categorySection.appendChild(
                    metricsGrid
                );

                container.appendChild(
                    categorySection
                );
            }

            syncHistoricalMetricSelector(true);

        } catch (error) {

            container.innerHTML = "";

            errorContainer.textContent =
                "Error loading metrics: " +
                error.message;

        } finally {

            button.disabled = false;
            button.textContent = "Load Metrics";
        }
    }


    let selectedHistoricalMetric = "wip";
    let selectedHistoricalDays = 14;

    const historicalMetricNames = [
        "wip",
        "throughput",
        "cycle_time",
        "lead_time",
        "velocity",
        "commitment_vs_completed"
    ];


    function syncHistoricalMetricSelector(loadData = false) {

        const historySection =
            document.getElementById("history-section");

        if (
            historySection.dataset.projectLoaded !== "true"
        ) {
            historySection.style.display = "none";
            return;
        }

        const historyMetricSelector =
            document.querySelector(".history-metric-selector");

        // Historical Metrics is its own analytical view.
        // It should expose every historical metric we support, regardless
        // of which snapshot cards the user selected above.
        const selectedHistoricalMetrics =
            historicalMetricNames.filter(metric =>
                document.getElementById(`history-metric-${metric}`)
            );

        historySection.style.display = "block";

        document
            .querySelectorAll(".history-metric-selector button")
            .forEach(button => {

                const metric =
                    button.id.replace(
                        "history-metric-",
                        ""
                    );

                button.style.display =
                    selectedHistoricalMetrics.includes(metric)
                        ? "inline-block"
                        : "none";
            });

        const currentMetricStillSelected =
            selectedHistoricalMetrics.includes(
                selectedHistoricalMetric
            );

        if (!currentMetricStillSelected) {

            selectedHistoricalMetric =
                selectedHistoricalMetrics[0];
        }

        document
            .querySelectorAll(".history-metric-selector button")
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.id ===
                        `history-metric-${selectedHistoricalMetric}`
                );
            });

        if (loadData || !currentMetricStillSelected) {
            loadHistoricalMetrics(selectedHistoricalDays);
        }
    }


    function selectHistoricalMetric(metric) {

        if (!historicalMetricNames.includes(metric)) {
            return;
        }

        selectedHistoricalMetric = metric;

        document
            .querySelectorAll(".history-metric-selector button")
            .forEach(button => button.classList.remove("active"));

        document
            .getElementById(`history-metric-${metric}`)
            .classList.add("active");

        loadHistoricalMetrics(selectedHistoricalDays);
    }


    async function loadHistoricalMetrics(days = 14) {

        const project =
            document.getElementById("project-select").value.trim();

        const chart =
            document.getElementById("history-chart");

        const status =
            document.getElementById("history-status");

        const errorContainer =
            document.getElementById("error");

        if (!project) {

            errorContainer.textContent =
                "Project is required";

            return;
        }

        selectedHistoricalDays = days;

        chart.innerHTML = "";

        const isPlanningMetric =
            selectedHistoricalMetric === "velocity" ||
            selectedHistoricalMetric === "commitment_vs_completed";

        status.textContent =
            `Loading ${isPlanningMetric ? "historical iteration" : "historical"} ${formatMetricName(selectedHistoricalMetric)}...`;

        document
            .querySelectorAll(".history-controls button")
            .forEach(
                button =>
                    button.classList.remove("active")
            );

        document
            .querySelectorAll(".history-controls button")
            .forEach(button => {
                button.style.display = isPlanningMetric
                    ? "none"
                    : "inline-block";
            });

        if (!isPlanningMetric) {
            document
                .getElementById(`days-${days}`)
                .classList.add("active");
        }

        try {

            const response =
                await fetch(
                    `/projects/${encodeURIComponent(project)}/metrics/history` +
                    `?metric=${encodeURIComponent(selectedHistoricalMetric)}` +
                    `&days=${days}` +
                    `&source=${encodeURIComponent(document.getElementById("source-select").value)}`
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to load historical metrics"
                );
            }

            const data =
                await response.json();

            renderHistoricalChart(data);

        } catch (error) {

            chart.innerHTML = "";

            status.textContent = "";

            errorContainer.textContent =
                "Error loading historical metrics: " +
                error.message;
        }
    }


    function renderHistoricalChart(data) {

        const chart =
            document.getElementById("history-chart");

        const status =
            document.getElementById("history-status");

        const title =
            document.getElementById("history-chart-title");

        chart.innerHTML = "";

        const metricName =
            formatMetricName(data.metric);

        title.textContent =
            `${metricName} · ${data.unit}`;

        if (!data.points || data.points.length === 0) {

            status.textContent =
                "No historical data available.";

            return;
        }

        const points = data.points;

        const width = 1000;
        const height = 350;

        const paddingLeft = 60;
        const paddingRight = 25;
        const paddingTop = 20;
        const paddingBottom = 50;

        const chartWidth =
            width -
            paddingLeft -
            paddingRight;

        const chartHeight =
            height -
            paddingTop -
            paddingBottom;

        const numericValues =
            points
                .map(point => point.value)
                .filter(value =>
                    value !== null &&
                    Number.isFinite(value)
                );

        if (numericValues.length === 0) {

            renderEmptyHistoricalChart(
                chart,
                width,
                height,
                "No measurable data in this period."
            );

            status.textContent =
                `${metricName} history · ${points.length} days · insufficient data`;

            return;
        }

        const maxValue =
            Math.max(...numericValues, 1);

        const svgNS =
            "http://www.w3.org/2000/svg";


        function createElement(
            name,
            attributes = {}
        ) {

            const element =
                document.createElementNS(
                    svgNS,
                    name
                );

            for (
                const [key, value]
                of Object.entries(attributes)
            ) {

                element.setAttribute(
                    key,
                    value
                );
            }

            return element;
        }


        // Horizontal grid + Y labels

        const gridSteps =
            maxValue <= 5
                ? Math.max(1, Math.ceil(maxValue))
                : 5;

        for (
            let i = 0;
            i <= gridSteps;
            i++
        ) {

            const value =
                (maxValue / gridSteps) * i;

            const y =
                paddingTop +
                chartHeight -
                (value / maxValue) *
                    chartHeight;

            const line =
                createElement(
                    "line",
                    {
                        x1: paddingLeft,
                        y1: y,
                        x2: width - paddingRight,
                        y2: y,
                        stroke: "#e5e5e5"
                    }
                );

            chart.appendChild(line);

            const label =
                createElement(
                    "text",
                    {
                        x: paddingLeft - 10,
                        y: y + 4,
                        "text-anchor": "end",
                        "font-size": "12",
                        fill: "#777"
                    }
                );

            label.textContent =
                formatHistoricalValue(
                    value,
                    data.unit
                );

            chart.appendChild(label);
        }


        // Build one SVG path per contiguous sequence.
        // Null values create gaps instead of fake zeroes.

        let currentSegment = [];

        const segments = [];

        points.forEach((point, index) => {

            if (
                point.value === null ||
                !Number.isFinite(point.value)
            ) {

                if (currentSegment.length > 0) {
                    segments.push(currentSegment);
                    currentSegment = [];
                }

                return;
            }

            const x =
                points.length === 1
                    ? paddingLeft +
                      chartWidth / 2
                    : paddingLeft +
                      (index /
                          (points.length - 1)) *
                          chartWidth;

            const y =
                paddingTop +
                chartHeight -
                (point.value / maxValue) *
                    chartHeight;

            currentSegment.push({
                x,
                y,
                date: point.date,
                value: point.value
            });
        });

        if (currentSegment.length > 0) {
            segments.push(currentSegment);
        }


        // Lines

        segments.forEach(segment => {

            if (segment.length < 2) {
                return;
            }

            const polyline =
                createElement(
                    "polyline",
                    {
                        points: segment
                            .map(
                                point =>
                                    `${point.x},${point.y}`
                            )
                            .join(" "),
                        fill: "none",
                        stroke: "#222",
                        "stroke-width": "3",
                        "stroke-linejoin": "round",
                        "stroke-linecap": "round"
                    }
                );

            chart.appendChild(polyline);
        });


        // Points + tooltips

        segments.forEach(segment => {

            segment.forEach(point => {

                const circle =
                    createElement(
                        "circle",
                        {
                            cx: point.x,
                            cy: point.y,
                            r: 5,
                            fill: "#222"
                        }
                    );

                const tooltip =
                    createElement("title");

                tooltip.textContent =
                    `${formatChartLabel(point)}: ` +
                    `${formatHistoricalValue(point.value, data.unit)}`;

                circle.appendChild(tooltip);

                chart.appendChild(circle);
            });
        });


        // X labels

        const labelStep =
            Math.max(
                1,
                Math.ceil(points.length / 7)
            );

        points.forEach(
            (point, index) => {

                if (
                    index % labelStep !== 0 &&
                    index !== points.length - 1
                ) {
                    return;
                }

                const x =
                    points.length === 1
                        ? paddingLeft +
                          chartWidth / 2
                        : paddingLeft +
                          (index /
                              (points.length - 1)) *
                              chartWidth;

                const label =
                    createElement(
                        "text",
                        {
                            x,
                            y: height - 15,
                            "text-anchor": "middle",
                            "font-size": "12",
                            fill: "#777"
                        }
                    );

                label.textContent =
                    formatChartLabel(point);

                chart.appendChild(label);
            }
        );


        const measurableDays =
            numericValues.length;

        const planningMetric =
            data.metric === "velocity" ||
            data.metric === "commitment_vs_completed";

        status.textContent = planningMetric
            ? `${metricName} history · ${points.length} iterations · ${measurableDays} measurable iteration${measurableDays === 1 ? "" : "s"}`
            : `${metricName} history · ${points.length} days · ${measurableDays} measurable day${measurableDays === 1 ? "" : "s"}`;
    }


    function renderEmptyHistoricalChart(
        chart,
        width,
        height,
        message
    ) {

        const svgNS =
            "http://www.w3.org/2000/svg";

        const text =
            document.createElementNS(
                svgNS,
                "text"
            );

        text.setAttribute(
            "x",
            width / 2
        );

        text.setAttribute(
            "y",
            height / 2
        );

        text.setAttribute(
            "text-anchor",
            "middle"
        );

        text.setAttribute(
            "font-size",
            "15"
        );

        text.setAttribute(
            "fill",
            "#777"
        );

        text.textContent = message;

        chart.appendChild(text);
    }


    function formatMetricName(metric) {

        return metric
            .replaceAll("_", " ")
            .replace(
                /\b\w/g,
                letter =>
                    letter.toUpperCase()
            );
    }


    function formatHistoricalValue(
        value,
        unit
    ) {

        if (value === null) {
            return "N/A";
        }

        if (unit === "days" || unit === "percent") {

            return Number(value)
                .toFixed(2);
        }

        return Math.round(value)
            .toString();
    }


    function formatChartLabel(point) {

        if (point.label) {
            return point.label;
        }

        return formatChartDate(point.date);
    }


    function formatChartDate(dateString) {

        const date =
            new Date(
                `${dateString}T00:00:00`
            );

        return date.toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric"
            }
        );
    }


    async function initializeDashboard() {

        try {

            await loadAvailableMetrics();
            await loadSources();

            // Do not load project data automatically.
            // Project data is loaded only after the user clicks Load Metrics.

        } catch (error) {

            document.getElementById("error")
                .textContent =
                    "Error initializing dashboard: " +
                    error.message;
        }
    }


    initializeDashboard();

</script>
